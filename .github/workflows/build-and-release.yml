name: Build and Release dev & prod

on:
  push:
    branches:
      - 'test-**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag to upload built artifacts to (leave empty to only build/upload artifacts)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: codex-rs

      - name: Build dev executable
        shell: bash
        working-directory: codex-rs
        run: |
          cargo build --bin codex --timings

      - name: Build prod executable
        shell: bash
        working-directory: codex-rs
        run: |
          cargo build --bin codex --release --timings

      - name: Stage executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/staging"
          cp "codex-rs/target/debug/codex.exe" "$GITHUB_WORKSPACE/staging/codex-dev.exe"
          cp "codex-rs/target/release/codex.exe" "$GITHUB_WORKSPACE/staging/codex.exe"

      - name: Upload built executables as artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-windows-binaries
          path: staging/*
          if-no-files-found: error

  release:
    name: Create Release (Windows)
    needs: build
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download built executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-windows-binaries
          path: staging

      - name: Determine release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            echo "TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"
          fi
          if [[ -z "${TAG}" ]]; then
            echo "No release tag specified; skipping release creation."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Upload release assets
        if: env.SKIP != 'true'
        uses: softprops/action-gh-release@v2.1.0
        with:
          files: staging/*
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
