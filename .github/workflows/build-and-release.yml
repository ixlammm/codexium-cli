name: Build and Release dev & prod

on:
  push:
    branches:
      - 'test-**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@23bdb251a0b7c6c0e6e3be0635e19cd88c0c0dcf # v2.7.8
        with:
          workspaces: codex-rs

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev bubblewrap

      - name: Build dev executable
        shell: bash
        working-directory: codex-rs
        run: |
          cargo build --bin codex --timings

      - name: Build prod executable
        shell: bash
        working-directory: codex-rs
        run: |
          cargo build --bin codex --release --timings

      - name: Stage executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/staging"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "codex-rs/target/debug/codex.exe" "$GITHUB_WORKSPACE/staging/codex-${{ matrix.os }}-dev.exe"
            cp "codex-rs/target/release/codex.exe" "$GITHUB_WORKSPACE/staging/codex-${{ matrix.os }}-prod.exe"
          else
            cp "codex-rs/target/debug/codex" "$GITHUB_WORKSPACE/staging/codex-${{ matrix.os }}-dev"
            cp "codex-rs/target/release/codex" "$GITHUB_WORKSPACE/staging/codex-${{ matrix.os }}-prod"
          fi

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95e2b8b1c9b7d51a6c1f7b613f5f7c6cc0a2c64 # v2.1.0
        with:
          files: staging/*
          name: ${{ github.ref_name }}
          generate_release_notes: true
